  description: null
- id: GV.SC-04
  level: subcategory
  parent: GV.SC
  title: Suppliers are known and prioritized by criticality
  description: null
- id: GV.SC-05
  level: subcategory
  parent: GV.SC
  title: Requirements to address cybersecurity risks in supply chains are established, prioritized, and
