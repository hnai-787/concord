status: active
requirements:
- id: GV
  level: function
  parent: null
  title: GOVERN
  description: The organization's cybersecurity risk management strategy, expectations, and policy are
    established, communicated, and monitored
- id: GV.OC
  level: category
  parent: GV
  title: Organizational Context
  description: The circumstances - mission, stakeholder expectations, dependencies, and legal, regulatory,
    and contractual requirements - surrounding the organization's cybersecurity risk management decisions
    are understood
- id: GV.OC-01
  level: subcategory
  parent: GV.OC
  title: The organizational mission is understood and informs cybersecurity risk management
  description: null
- id: GV.OC-02
  level: subcategory
  parent: GV.OC
  title: Internal and external stakeholders are understood, and their needs and expectations regarding
    cybersecurity risk management are understood and considered
  description: null
- id: GV.OC-03
  level: subcategory
  parent: GV.OC
  title: Legal, regulatory, and contractual requirements regarding cybersecurity - including privacy and
    civil liberties obligations - are understood and managed
  description: null
- id: GV.OC-04
  level: subcategory
  parent: GV.OC
  title: Critical objectives, capabilities, and services that external stakeholders depend on or expect
    from the organization are understood and communicated
  description: null
- id: GV.OC-05
  level: subcategory
  parent: GV.OC
  title: Outcomes, capabilities, and services that the organization depends on are understood and communicated
  description: null
- id: GV.RM
  level: category
  parent: GV
  title: Risk Management Strategy
  description: The organization's priorities, constraints, risk tolerance and appetite statements, and
