- id: GV.OV-01
  level: subcategory
  parent: GV.OV
  title: Cybersecurity risk management strategy outcomes are reviewed to inform and adjust strategy and
    direction
  description: null
- id: GV.OV-02
  level: subcategory
  parent: GV.OV
  title: The cybersecurity risk management strategy is reviewed and adjusted to ensure coverage of organizational
