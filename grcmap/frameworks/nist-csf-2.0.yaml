id: nist-csf-2.0
title: NIST Cybersecurity Framework 2.0
issuer: National Institute of Standards and Technology (NIST)
version: '2.0'
issued: '2024-02-26'
instrument: NIST CSWP 29
source:
  publisher: NIST
  retrieved: '2026-09-08'
  url: https://csrc.nist.gov/extensions/nudp/services/json/csf/download
  note: Official NIST CPRT (Cybersecurity and Privacy Reference Tool) export. Text is a U.S. government
