id: pci-dss-4.0.1
title: Payment Card Industry Data Security Standard v4.0.1
issuer: PCI Security Standards Council (PCI SSC)
version: 4.0.1
issued: '2024-06-01'
instrument: PCI DSS v4.0.1 (a limited revision of v4.0 -- PCI SSC states it added
  no new requirements and deleted none, only corrected errors and clarified
  requirements/guidance, including points in Requirements 3, 6, 8, and 12; v4.0
  was retired 2024-12-31). Requirements that were future-dated to 2025-03-31 in
  v4.0/v4.0.1 are now in effect.
source:
  publisher: PCI SSC
  note: Only the 12 top-level requirement titles are recorded here (PCI SSC's own
    published requirement names). The hierarchical numbered sub-requirements
    (e.g. 8.1, 8.2.x) are real parts of the standard but are NOT enumerated in
    this v1 catalog -- a deliberate, disclosed scope decision (see README.md
    Limitations); the schema (level/parent) already supports adding them.
