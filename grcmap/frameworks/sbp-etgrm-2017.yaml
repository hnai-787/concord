source:
  publisher: State Bank of Pakistan
  note: The six major domains below are SBP's own published framework structure
    (also reproduced by SBP itself in its Financial Stability Review). Only the
    top-level domain structure is modeled in this v1 catalog -- SBP's full
    framework document defines detailed sub-requirements per domain that are
    NOT enumerated here (a deliberate, disclosed scope decision, matching the
    PCI DSS catalog's same choice). Related/amending circulars (e.g. BPRD
    07/2016 on cyber-attack prevention, BPRD 06/2019 on outsourcing risk, BPRD
    04/2020 on cloud outsourcing, BPRD 04/2023 on digital banking security) are
    part of the real applicable regulatory catalog but are recorded only as
    `related_instruments` metadata here, not modeled as separate requirement sets.
related_instruments:
