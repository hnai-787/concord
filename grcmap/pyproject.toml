[project]
name = "grcmap"
version = "1.0.0"
description = "Cross-framework compliance-mapping and gap-analysis engine (ISO 27001, PCI DSS, NIST CSF, SBP ETGRM)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
grcmap = "grcmap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
